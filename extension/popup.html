<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniClip</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-wrapper">
          <svg viewBox="0 0 128 128" width="22" height="22">
            <rect width="128" height="128" rx="28" fill="#6366f1" />
            <path d="M40 32 C40 28 43 25 47 25 L81 25 C85 25 88 28 88 32 L88 98 L64 82 L40 98 Z" fill="#ffffff" />
            <path d="M64 42 L66.5 50.5 L75 53 L66.5 55.5 L64 64 L61.5 55.5 L53 53 L61.5 50.5 Z" fill="#8b5cf6" />
          </svg>
        </div>
        <span class="brand-title">OmniClip</span>
      </div>
      <div class="status-badge" id="statusBadge" title="Backend Connection Status">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Ready</span>
      </div>
    </header>

    <!-- Page Info Card -->
    <div class="page-card">
      <div class="page-header">
        <img id="pageFavicon" class="page-favicon" src="icons/icon16.png" alt="" />
        <span class="page-domain" id="pageDomain">Detecting tab...</span>
      </div>
      <h3 class="page-title" id="pageTitle">Loading current page...</h3>
      <div class="page-meta">
        <span class="meta-tag" id="metaWordCount">0 words</span>
        <span class="meta-tag" id="metaReadTime">1 min read</span>
      </div>
    </div>

    <!-- Quick Action Buttons -->
    <div class="actions">
      <button class="btn btn-primary" id="btnQuickClip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Save Clip</span>
      </button>

      <button class="btn btn-secondary" id="btnOpenSidepanel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span>AI Side Panel & Chat</span>
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <a href="http://localhost:3000" target="_blank" class="dashboard-link" id="openDashboardLink">
        <span>Open Second Brain Dashboard</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
